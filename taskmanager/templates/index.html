<!DOCTYPE html>
<html>

<head>
    <title>Taskmanager</title>
</head>

<body>
    <h1>{{ name }}</h1>
    <p>Willkommen bei unserem Taskmanager!</p>
</body>

<ul>
    {% for task in tasks %}
    <li>
        {{ task["title"] }}
        – Status: {{ task["status"] }}
        – Priorität: {{ task["priority"] }}
    </li>
    {% endfor %}
</ul>

</html>
